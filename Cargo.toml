[package]
name = "meshtop"
version = "0.1.0"
edition = "2024"
description = "Live resource usage and connections across your machines, in one terminal"
license = "MIT"
repository = "https://github.com/FormalSnake/meshtop"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
netstat2 = "0.11.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
toml = "1.1.8"
