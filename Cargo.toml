[package]
name = "meshtop"
version = "0.1.0"
edition = "2024"
description = "Live resource usage and connections across your machines, in one terminal"
license = "MIT"
repository = "https://github.com/FormalSnake/meshtop"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
netstat2 = "0.11.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
toml = "1.1.8"
ureq = { version = "3.3.0", features = ["json"] }
