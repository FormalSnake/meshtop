[workspace]
resolver = "3"
members = ["crates/core", "crates/meshtop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FormalSnake/meshtop"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
netstat2 = "0.11.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
toml = "1.1.8"
ureq = { version = "3.3.0", features = ["json"] }
